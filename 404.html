<style>
:root{
  --maroon:#7a152d;
  --maroon-dark:#4d0a1a;
  --gold:#c59b27;
  --gold-light:#d4a72c;
  --text:#0f172a;
  --muted:#475569;
}
*, *::before, *::after { box-sizing: border-box; }
body{
  margin:0;
  font-family:Inter, "Noto Sans Devanagari", sans-serif;
  background:linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  color:var(--text);
  display:grid;
  place-items:center;
  min-height:100vh;
  text-align:center;
  padding:20px;
}
.box{
  width:min(100%, 560px);
  background:#ffffff;
  border:1px solid rgba(122,21,45,0.15);
  border-radius:24px;
  padding:45px 35px;
  box-shadow:0 20px 45px rgba(15,23,42,0.08);
}
.logo-wrap{
  width:90px;
  height:90px;
  margin:0 auto 24px;
  border-radius:50%;
  background:#fff;
  border:2px solid var(--maroon);
  padding:4px;
  box-shadow:0 5px 15px rgba(122,21,45,0.15);
  display:grid;
  place-items:center;
}
.logo-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:50%;
}
h1{
  font-size:72px;
  margin:0 0 10px;
  font-weight:800;
  color:var(--maroon);
  letter-spacing:-2px;
}
h2{
  font-size:24px;
  margin:0 0 12px;
  color:var(--text);
  font-weight:700;
}
p{
  color:var(--muted);
  font-size:16px;
  line-height:1.6;
  margin:0 auto 30px;
  max-width:440px;
}
.btn-group{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}
a.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 24px;
  border-radius:12px;
  text-decoration:none;
  font-weight:700;
  font-size:15px;
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}
a.btn:hover{
  transform:translateY(-2px);
}
.home{
  background:linear-gradient(135deg, var(--maroon), #9e1f3b);
  color:#fff;
  box-shadow:0 8px 20px rgba(122,21,45,0.25);
}
.wa{
  background:#25d366;
  color:#fff;
  box-shadow:0 8px 20px rgba(37,211,102,0.25);
}
</style>
</head>
<body>
<div class="box">
  <div class="logo-wrap">
    <img src="logo.png" alt="SUBITA INFRATECH">

  <h1>404</h1>
  <h2>पेज नहीं मिला (Page Not Found)</h2>
  <p>जिस पेज की आप तलाश कर रहे हैं, कृपया मुख्य वेबसाइट पर लौटें।</p>
  <div class="btn-group">
    <a class="btn home" href="/"><i class="fa-solid fa-house"></i> मुख्य वेबसाइट</a>
    <a class="btn wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/918948517532?text=Namaste%20SUBITA%20INFRATECH%2C%20mujhe%20website%20par%20404%20error%20mila%20hai."><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
  </div>
</div>
</body>
</html>
